syntax = "proto3";

package blueprint.work.ds4_arch;

import "blueprint/v1/blueprint.proto";
import "serve.types.proto";

message launch_plan {
  option (blueprint.v1.type_contract) = {
    type_id: "blueprint.work.ds4_arch.launch_plan"
    represents: "DwarfStar launch plan for GLM 5.2 TP4 on four GX10 ranks"
    semantics {
      entry_id: "t-launch-plan"
      key: "meaning"
      value: "DwarfStar launch plan for GLM 5.2 TP4 on four GX10 ranks"
      status: SUPPORTED
    }
  };
  int32 tp_size = 1 [(blueprint.v1.field_contract) = { meaning: "tensor parallel degree, fixed to 4" }];
  int32 rank_count = 2 [(blueprint.v1.field_contract) = { meaning: "four ranks" }];
  string model_name = 3 [(blueprint.v1.field_contract) = { meaning: "served GLM 5.2 model identifier" }];
  string checkpoint_root = 4 [(blueprint.v1.field_contract) = { meaning: "checkpoint directory visible to every rank" }];
  string dwarfstart_command = 5 [(blueprint.v1.field_contract) = { meaning: "DwarfStar launch command and environment" }];
  string fabric_addr = 6 [(blueprint.v1.field_contract) = { meaning: "rank-local TP/DCP data-plane address on the CRS812 200G fabric, not the management SSH address" }];
  string fabric_data_plane = 7 [(blueprint.v1.field_contract) = { meaning: "data-plane identity for collective traffic, fixed to crs812-200g for the four GX10 deployment" }];
  string management_addr = 8 [(blueprint.v1.field_contract) = { meaning: "management/control-plane SSH address; must not be used for TP/DCP collective traffic" }];
}

message shard_manifest {
  option (blueprint.v1.type_contract) = {
    type_id: "blueprint.work.ds4_arch.shard_manifest"
    represents: "Per-rank checkpoint shard manifest for GLM 5.2 TP4"
    semantics {
      entry_id: "t-shard-manifest"
      key: "meaning"
      value: "Per-rank checkpoint shard manifest for GLM 5.2 TP4"
      status: SUPPORTED
    }
  };
  int32 rank = 1 [(blueprint.v1.field_contract) = { meaning: "rank id 0..3" }];
  repeated string base_shard_files = 2 [(blueprint.v1.field_contract) = { meaning: "base model shard file paths" }];
  repeated string mtp_shard_files = 3 [(blueprint.v1.field_contract) = { meaning: "MTP/speculator shard file paths" }];
  bool has_foreign_rank_shard = 4 [(blueprint.v1.field_contract) = { meaning: "true indicates a placement bug" }];
  string reference_runtime = 5 [(blueprint.v1.field_contract) = { meaning: "Bird/vLLM validated runtime reference" }];
}

message loaded_rank_shard {
  option (blueprint.v1.type_contract) = {
    type_id: "blueprint.work.ds4_arch.loaded_rank_shard"
    represents: "Resident mapped weights for one TP4 rank after DwarfStar model load"
    semantics {
      entry_id: "t-loaded-rank-shard"
      key: "meaning"
      value: "Resident mapped weights for one TP4 rank after DwarfStar model load"
      status: SUPPORTED
    }
  };
  int32 rank = 1 [(blueprint.v1.field_contract) = { meaning: "rank id 0..3" }];
  int32 layer_count = 2 [(blueprint.v1.field_contract) = { meaning: "number of GLM decoder layers loaded" }];
  uint64 mapped_bytes = 3 [(blueprint.v1.field_contract) = { meaning: "resident mapped weight bytes" }];
  int32 q_head_start = 4 [(blueprint.v1.field_contract) = { meaning: "first owned query head" }];
  int32 q_head_end = 5 [(blueprint.v1.field_contract) = { meaning: "exclusive end of owned query heads" }];
  int32 expert_start = 6 [(blueprint.v1.field_contract) = { meaning: "first routed expert id present in this rank's expert tensor shard; Bird GLM 5.2 TP4 keeps all expert ids on every rank and shards expert matrix dimensions" }];
  int32 expert_end = 7 [(blueprint.v1.field_contract) = { meaning: "exclusive end of routed expert ids present in this rank's expert tensor shard; expected [0,256) for Bird GLM 5.2 TP4" }];
  int32 vocab_start = 8 [(blueprint.v1.field_contract) = { meaning: "first owned vocab row" }];
  int32 vocab_end = 9 [(blueprint.v1.field_contract) = { meaning: "exclusive end of owned vocab rows" }];
}

message gpu_resident_tensor_binding {
  option (blueprint.v1.type_contract) = {
    type_id: "blueprint.work.ds4_arch.gpu_resident_tensor_binding"
    represents: "One rank-local GPU-resident model tensor produced from a validated mmap slice."
    semantics {
      entry_id: "t-gpu-resident-tensor-binding"
      key: "meaning"
      value: "One rank-local GPU-resident model tensor produced from a validated mmap slice."
      status: SUPPORTED
    }
  };
  string tensor_name = 1 [(blueprint.v1.field_contract) = { meaning: "canonical DS4 tensor name copied from the validated mapped slice" }];
  string tensor_role = 2 [(blueprint.v1.field_contract) = { meaning: "accepted tensor role such as q_head, mla_kv, expert, vocab, output, or replicated" }];
  string distribution_scope = 3 [(blueprint.v1.field_contract) = { meaning: "rank_local_shard or replicated scope retained from the mapped slice" }];
  int32 rank = 4 [(blueprint.v1.field_contract) = { meaning: "owning TP rank for this resident tensor" }];
  int32 device_id = 5 [(blueprint.v1.field_contract) = { meaning: "rank-local physical/logical GPU device that owns the resident tensor allocation" }];
  uint64 byte_length = 6 [(blueprint.v1.field_contract) = { meaning: "device allocation payload bytes copied from the validated mapped slice" }];
  string dtype = 7 [(blueprint.v1.field_contract) = { meaning: "validated storage dtype for the resident tensor bytes" }];
  repeated uint64 shape = 8 [(blueprint.v1.field_contract) = { meaning: "validated rank-local logical tensor shape dimensions" }];
  uint64 element_count = 9 [(blueprint.v1.field_contract) = { meaning: "validated element count derived from shape" }];
  uint64 shape_hash = 10 [(blueprint.v1.field_contract) = { meaning: "stable runtime hash binding dtype and shape for kernel identity checks" }];
  bool ready = 11 [(blueprint.v1.field_contract) = { meaning: "true only after allocation, device ownership validation, and upload copy succeed" }];
}
