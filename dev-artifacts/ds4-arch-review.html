<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blueprint browser</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(#f6f7f9, #111418);
      --surface: light-dark(#ffffff, #1a1f26);
      --surface-2: light-dark(#eef1f5, #242b34);
      --text: light-dark(#19202a, #edf1f6);
      --muted: light-dark(#5c6675, #a9b3c0);
      --border: light-dark(#d7dce3, #3a4552);
      --primary: light-dark(#1f61d1, #8bb5ff);
      --data: light-dark(#dcecff, #183b5d);
      --state-node: light-dark(#ffe7e1, #58322d);
      --action: light-dark(#ece7ff, #352b5c);
      --control: light-dark(#fff0d5, #51391a);
      --effect: light-dark(#dff5ec, #183f35);
      --danger: light-dark(#fde5e7, #50272d);
      --state: light-dark(#c0392b, #ff8080);
      --shadow: light-dark(rgba(25,32,42,.12), rgba(0,0,0,.35));
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    button, select { font: inherit; }
    button { color: inherit; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow-wrap: anywhere; }
    .app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }
    .toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--surface); border-bottom: 1px solid var(--border); box-shadow: 0 2px 8px var(--shadow); z-index: 3; }
    .brand { min-width: 0; margin-right: auto; }
    .brand strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand small { color: var(--muted); }
    .control { border: 1px solid var(--border); background: var(--surface); border-radius: 7px; padding: 6px 9px; cursor: pointer; }
    .control:hover:not(:disabled), .control[aria-pressed="true"] { border-color: var(--primary); color: var(--primary); }
    .control:disabled { opacity: .45; cursor: default; }
    .zoom-value { min-width: 48px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
    .workspace { min-height: 0; display: grid; grid-template-columns: 250px minmax(0, 1fr) 420px; }
    .sidebar, .detail { min-height: 0; overflow: auto; background: var(--surface); }
    .sidebar { border-right: 1px solid var(--border); padding: 12px; }
    .detail { border-left: 1px solid var(--border); padding: 16px; }
    .canvas-wrap { min-width: 0; min-height: 0; position: relative; background-color: var(--bg); background-image: radial-gradient(var(--border) .7px, transparent .7px); background-size: 18px 18px; }
    #graph-canvas { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
    #graph-canvas.is-dragging { cursor: grabbing; }
    .section-title { margin: 0 0 7px; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
    .graph-list { display: grid; gap: 4px; margin-bottom: 16px; }
    .graph-link { width: 100%; border: 1px solid transparent; background: transparent; border-radius: 7px; padding: 7px 8px; text-align: left; cursor: pointer; }
    .graph-link:hover { background: var(--surface-2); }
    .graph-link.is-selected { background: var(--surface-2); border-color: var(--primary); }
    .graph-link span { display: block; color: var(--muted); font-size: 12px; }
    .identity { border-top: 1px solid var(--border); padding-top: 12px; color: var(--muted); font-size: 12px; }
    .identity div { margin-bottom: 6px; }
    .identity code { display: block; color: var(--text); }
    .feedback-panel { border-top: 1px solid var(--border); margin-top: 14px; padding-top: 12px; display: grid; gap: 8px; }
    .feedback-selected { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .feedback-selected code { color: var(--text); }
    .feedback-panel textarea { resize: vertical; font: inherit; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 7px; padding: 7px 9px; }
    .feedback-panel textarea:focus { outline: none; border-color: var(--primary); }
    .feedback-list { display: grid; gap: 8px; max-height: 260px; overflow: auto; }
    .feedback-item { border: 1px solid var(--border); border-radius: 7px; padding: 8px 9px; background: var(--surface-2); }
    .feedback-item.is-resolved { opacity: .55; }
    .feedback-item .fb-head { display: flex; gap: 6px; align-items: baseline; font-size: 11px; color: var(--muted); }
    .feedback-item .fb-seq { font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
    .feedback-item .fb-status { text-transform: uppercase; font-weight: 700; }
    .feedback-item .fb-status.pending { color: var(--danger); }
    .feedback-item .fb-status.resolved { color: #1f9678; }
    .feedback-item .fb-owner { color: var(--primary); font-weight: 700; }
    .feedback-item .fb-comment { margin: 6px 0 4px; white-space: pre-line; font-size: 13px; }
    .feedback-item .fb-ref { font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
    .feedback-item .fb-resolve { margin-top: 6px; }
    .feedback-empty { color: var(--muted); font-size: 12px; }
    .edge-visible { fill: none; stroke: var(--border); stroke-width: 1.6; marker-end: url(#arrow); }
    .edge-visible.is-control { stroke-dasharray: 6 5; }
    .edge-visible.is-state { stroke: var(--state); stroke-dasharray: 10 6 3 6; stroke-width: 2.2; }
    .edge-hit { fill: none; stroke: transparent; stroke-width: 16; cursor: pointer; }
    .edge-group:hover .edge-visible, .edge-group.is-selected .edge-visible { stroke: var(--primary); stroke-width: 3; }
    .edge-group.is-related .edge-visible { stroke: var(--primary); stroke-width: 2.4; }
    .edge-label { fill: var(--muted); font-size: 11px; text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: var(--bg); stroke-width: 5; stroke-linejoin: round; }
    .node { cursor: pointer; }
    .node-shape { fill: var(--surface); stroke: var(--border); stroke-width: 1.5; filter: drop-shadow(0 2px 2px var(--shadow)); }
    .node[data-kind="DATA"] .node-shape { fill: var(--data); }
    .node[data-kind="STATE"] .node-shape { fill: var(--state-node); }
    .node[data-kind="ACTION"] .node-shape { fill: var(--action); }
    .node[data-kind="CONTROL"] .node-shape { fill: var(--control); }
    .node[data-kind="EFFECT"] .node-shape, .node[data-kind="EXIT"] .node-shape { fill: var(--effect); }
    .node:hover .node-shape, .node.is-selected .node-shape { stroke: var(--primary); stroke-width: 3; }
    .node.is-related .node-shape { stroke: var(--primary); stroke-width: 2.4; }
    .node-kind { fill: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: .06em; }
    .node-label { fill: var(--text); font-size: 13px; font-weight: 600; }
    .node-type { fill: var(--muted); font-size: 10px; }
    .node-expand { fill: var(--text); font-size: 10px; font-weight: 600; text-anchor: end; }
    .detail h2 { margin: 3px 0 2px; font-size: 20px; line-height: 1.25; }
    .kicker { color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; }
    .record-id { color: var(--muted); font-size: 12px; }
    .summary { margin: 12px 0; }
    .section { margin-top: 18px; }
    .section > h3 { margin: 0 0 7px; color: var(--muted); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }
    .semantic { border-top: 1px solid var(--border); padding: 9px 0; }
    .semantic:first-child { border-top: 0; }
    .semantic-key, .badge { display: inline-block; border-radius: 999px; background: var(--surface-2); padding: 1px 7px; font-size: 11px; font-weight: 600; }
    .semantic-key { margin-right: 6px; }
    .semantic-value { white-space: pre-line; }
    .semantic-meta { margin-top: 4px; color: var(--muted); font-size: 11px; }
    .button-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .link-button { border: 0; padding: 0; background: transparent; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; text-align: left; }
    .link-button:hover { color: var(--primary); }
    .primary-button, .secondary-button { border: 1px solid var(--border); border-radius: 7px; padding: 6px 9px; cursor: pointer; text-align: left; }
    .primary-button { background: var(--primary); color: light-dark(#fff, #111); border-color: var(--primary); }
    .secondary-button { background: var(--surface); }
    .secondary-button:hover { border-color: var(--primary); }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 6px 5px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; }
    .table-scroll { overflow-x: auto; }
    .evidence { margin: 0; padding-left: 18px; }
    .evidence li { margin-bottom: 7px; }
    .planned { border-left: 3px solid var(--control); padding: 7px 9px; background: var(--surface-2); }
    .empty { color: var(--muted); font-size: 12px; }
    .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; }
    @media (max-width: 1050px) {
      .workspace { grid-template-columns: 200px minmax(0, 1fr) 340px; }
    }
    @media (max-width: 820px) {
      .app { height: auto; min-height: 100%; }
      .toolbar { position: sticky; top: 0; flex-wrap: wrap; }
      .workspace { grid-template-columns: 1fr; }
      .sidebar, .detail { overflow: visible; border: 0; }
      .sidebar { border-bottom: 1px solid var(--border); }
      .graph-list { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
      .canvas-wrap { height: 68vh; min-height: 480px; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <div class="app" id="blueprint-browser">
    <header class="toolbar">
      <div class="brand"><strong id="graph-name">Blueprint</strong><small id="graph-meta"></small></div>
      <button class="control" id="parent-button" type="button">Parent</button>
      <button class="control" id="fit-button" type="button">Fit</button>
      <button class="control" id="zoom-out" type="button" aria-label="Zoom out">−</button>
      <span class="zoom-value" id="zoom-value">100%</span>
      <button class="control" id="zoom-in" type="button" aria-label="Zoom in">+</button>
    </header>
    <main class="workspace">
      <nav class="sidebar" aria-label="Blueprint hierarchy">
        <h2 class="section-title">Graphs</h2>
        <div class="graph-list" id="graph-list"></div>
        <div class="identity" id="blueprint-identity"></div>
        <div class="feedback-panel">
          <h2 class="section-title">Feedback</h2>
          <div class="feedback-selected" id="feedback-selected">No element selected</div>
          <textarea id="feedback-input" rows="3" placeholder="Add targeted feedback for the selected element"></textarea>
          <div class="button-row">
            <button class="primary-button" id="feedback-add" type="button">Add feedback</button>
            <button class="secondary-button" id="feedback-refresh" type="button">Refresh</button>
          </div>
          <div class="feedback-list" id="feedback-list"></div>
        </div>
      </nav>
      <section class="canvas-wrap" aria-label="Interactive graph canvas">
        <svg id="graph-canvas" role="img" aria-labelledby="svg-title svg-description">
          <title id="svg-title">Blueprint graph</title>
          <desc id="svg-description">Pan and zoom the typed data-flow graph. Select nodes and edges to inspect their contracts.</desc>
          <defs>
            <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"></path></marker>
          </defs>
          <g id="viewport"><g id="edge-layer"></g><g id="node-layer"></g></g>
        </svg>
      </section>
      <aside class="detail" id="detail" aria-live="polite" aria-label="Selected contract record"></aside>
    </main>
  </div>

    const app = document.getElementById("blueprint-browser");

    const zoomValue = document.getElementById("zoom-value");

    const NS = "http://www.w3.org/2000/svg";
    let currentGraphId = DATA.blueprint.root;
    let selected = {kind: "graph", id: currentGraphId};
    let layoutBounds = {width: 1, height: 1};
    let view = {x: 0, y: 0, scale: 1};
    let drag = null;

    document.title = `${DATA.blueprint.id} · Blueprint`;
    const esc = (value) => String(value ?? "").replace(/[&<>\"']/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[char]);
    const shortType = (value) => value ? value.split(".").pop() : "";
    const typeButton = (typeRef, label = shortType(typeRef)) => DATA.types[typeRef]
      ? `<button type="button" class="link-button" data-type-ref="${esc(typeRef)}">${esc(label)}</button>`
      : `<code>${esc(label || typeRef)}</code>`;
    const refText = (ref) => ref?.kind === "port" ? `${ref.owner}:${ref.direction}:${ref.id}` : `${ref?.kind || "unset"}:${ref?.id || "—"}`;
    const refButton = (ref, label = refText(ref)) => ref?.kind === "node"
      ? `<button class="secondary-button" type="button" data-node-ref="${esc(ref.id)}" data-graph-ref="${esc(currentGraphId)}">${esc(label)}</button>`
      : ref?.kind === "edge"
        ? `<button class="secondary-button" type="button" data-edge-ref="${esc(ref.id)}">${esc(label)}</button>`
        : `<code>${esc(label)}</code>`;

    function semanticHtml(entries) {
      if (!entries?.length) return `<div class="empty">No keyed semantic entries.</div>`;
      return entries.map((entry) => {
        const refs = [entry.object ? `object ${refText(entry.object)}` : "", entry.support?.length ? `support ${entry.support.map(refText).join(", ")}` : ""].filter(Boolean).join(" · ");
        return `<div class="semantic"><div><span class="semantic-key">${esc(entry.key)}</span><span class="semantic-value">${esc(entry.value)}</span></div><div class="semantic-meta"><code>${esc(entry.id)}</code> · ${esc(entry.status)}${refs ? ` · ${esc(refs)}` : ""}</div></div>`;
      }).join("");
    }

    function portTable(inputs, outputs) {
      const rows = [...(inputs || []).map((item) => ({...item, direction: "input"})), ...(outputs || []).map((item) => ({...item, direction: "output"}))];
      if (!rows.length) return `<div class="empty">No typed ports.</div>`;
      return `<div class="table-scroll"><table><thead><tr><th>Direction</th><th>Port</th><th>Type</th><th>Cardinality</th></tr></thead><tbody>${rows.map((item) => `<tr><td>${esc(item.direction)}</td><td><code>${esc(item.id)}</code></td><td>${typeButton(item.type)}</td><td>${esc(item.cardinality)}</td></tr>`).join("")}</tbody></table></div>`;
    }

    function evidenceHtml(ids, graph) {
      if (!ids?.length) return "";
      return `<section class="section"><h3>Evidence</h3><ul class="evidence">${ids.map((id) => {
        const item = graph.evidence[id];
        return item ? `<li><code>${esc(id)}</code><br>${esc(item.origin)} · <code>${esc(item.source)}${item.span ? `:${esc(item.span)}` : ""}</code>${item.sha256 ? `<br>sha256 <code>${esc(item.sha256)}</code>` : ""}</li>` : `<li><code>${esc(id)}</code></li>`;
      }).join("")}</ul></section>`;
    }

    function dataSourcesHtml(node) {
      if (node.kind !== "DATA" && !node.dataType) return "";
      if (!node.sources?.length) return `<section class="section"><h3>Data sources</h3><div class="empty">Generated inside this graph.</div></section>`;
      return `<section class="section"><h3>Data sources</h3><div class="table-scroll"><table><thead><tr><th>Source</th><th>Kind</th><th>Upstream reference</th><th>Input port</th><th>Meaning</th></tr></thead><tbody>${node.sources.map((source) => `<tr><td><code>${esc(source.id)}</code></td><td>${esc(source.kind)}</td><td><code>${esc(source.ref)}</code></td><td>${source.inputPort ? `<code>${esc(source.inputPort)}</code>` : `<span class="badge">API-implicit</span>`}</td><td>${esc(source.meaning)}</td></tr>`).join("")}</tbody></table></div></section>`;
    }

    function setDetail(value) {
      detail.innerHTML = value;
      detail.scrollTop = 0;
      detail.querySelectorAll("[data-type-ref]").forEach((button) => button.addEventListener("click", () => showType(button.dataset.typeRef)));
      detail.querySelectorAll("[data-node-ref]").forEach((button) => button.addEventListener("click", () => navigateToNode(button.dataset.graphRef, button.dataset.nodeRef)));
      detail.querySelectorAll("[data-edge-ref]").forEach((button) => button.addEventListener("click", () => showEdge(button.dataset.edgeRef)));
      detail.querySelectorAll("[data-operation-id]").forEach((button) => button.addEventListener("click", () => showOperation(button.dataset.operationId)));
      detail.querySelectorAll("[data-flow-id]").forEach((button) => button.addEventListener("click", () => showDataFlow(button.dataset.flowId)));
      detail.querySelector("[data-architecture]")?.addEventListener("click", () => showArchitecture());
      detail.querySelector("[data-expand-graph]")?.addEventListener("click", (event) => selectGraph(event.currentTarget.dataset.expandGraph));
      detail.querySelector("[data-return-node]")?.addEventListener("click", (event) => showNode(event.currentTarget.dataset.returnNode));
    }

    function graphDetail(graph) {

        ? `<p class="summary">${esc(graph.architectureRationale)}</p>`

      const flows = graph.dataFlows.map((item) => `<button class="secondary-button" type="button" data-flow-id="${esc(item.id)}"><strong>${esc(item.name)}</strong><br><code>${esc(item.id)}</code></button>`).join("");
      const architecture = graph.architecture ? `<section class="section"><h3>Static architecture</h3><button class="secondary-button" type="button" data-architecture><strong>${esc(graph.architecture.overview)}</strong><br>${esc(graph.architecture.components.length)} components · ${esc(graph.architecture.connections.length)} connections</button></section>` : "";
      setDetail(`<div class="kicker">L${DATA.registry[graph.id].depth} graph · ${esc(graph.lifecycle)}</div><h2>${esc(graph.name)}</h2><div class="record-id"><code>${esc(graph.id)}</code></div><section class="section"><h3>Intent</h3><p class="summary">${esc(graph.overall)}</p></section>${operations ? `<section class="section"><h3>Operations achieving the intent</h3><div class="button-row">${operations}</div></section>` : ""}${flows ? `<section class="section"><h3>High-level data flows</h3><div class="button-row">${flows}</div></section>` : ""}${architecture}<section class="section"><h3>Graph-shape rationale</h3>${rationale}</section><section class="section"><h3>Boundary contract</h3>${portTable(graph.inputs, graph.outputs)}</section><section class="section"><h3>Graph semantics</h3>${semanticHtml(graph.semantics)}</section>${children ? `<section class="section"><h3>Child refinements</h3><div class="button-row">${children}</div></section>` : ""}<section class="section"><h3>Identity</h3><div class="record-id">Contract <code>${esc(graph.digest)}</code><br>Graph <code>${esc(graph.graphDigest)}</code><br>Types <code>${esc(graph.typeSchema)}</code></div></section>`);
    }

    function memberHtml(members) {
      return members.map((member) => `<div class="semantic"><div>${refButton(member.ref)} <span class="semantic-value">${esc(member.role)}</span></div></div>`).join("");
    }

    function endGoalsHtml(endGoals) {
      const goals = endGoals || [];
      if (!goals.length) return "";
      return `<section class="section"><h3>End goals / intent</h3>${goals.map((goal) => {
        const bindings = (goal.bindings || []).map((binding) => `<div class="semantic"><div><span class="badge">${esc(binding.role)}</span> <strong>${refButton(binding.ref)}</strong></div>${semanticHtml(binding.semantics)}</div>`).join("");
        return `<div class="semantic"><div><strong>${esc(goal.intent)}</strong> <code>${esc(goal.id)}</code></div>${bindings ? `<div class="button-row">${(goal.bindings || []).map((b) => refButton(b.ref)).join("")}</div>${bindings}` : ""}${semanticHtml(goal.semantics)}</div>`;
      }).join("")}</section>`;
    }

    function showOperation(operationId) {
      const graph = DATA.graphs[currentGraphId];
      const operation = graph.operations.find((item) => item.id === operationId); if (!operation) return;

      const flows = operation.dataFlows.map((id) => `<button class="secondary-button" type="button" data-flow-id="${esc(id)}">${esc(id)}</button>`).join("");
      setDetail(`<div class="kicker">Operation</div><h2>${esc(operation.name)}</h2><div class="record-id"><code>${esc(operation.id)}</code></div><section class="section"><h3>Intent achieved</h3><p class="summary">${esc(operation.overview)}</p></section><section class="section"><h3>Graph members</h3>${memberHtml(operation.members)}</section>${flows ? `<section class="section"><h3>Participating data flows</h3><div class="button-row">${flows}</div></section>` : ""}${endGoalsHtml(operation.endGoals)}<section class="section"><h3>Keyed semantics</h3>${semanticHtml(operation.semantics)}</section>`);
    }

    function showDataFlow(flowId) {
      const graph = DATA.graphs[currentGraphId];
      const flow = graph.dataFlows.find((item) => item.id === flowId); if (!flow) return;
      selected = {kind: "data-flow", id: flow.id, refs: flow.members.map((item) => item.ref)}; highlightSelection();
      setDetail(`<div class="kicker">High-level data flow</div><h2>${esc(flow.name)}</h2><div class="record-id"><code>${esc(flow.id)}</code></div><p class="summary">${esc(flow.overview)}</p><section class="section"><h3>Sources</h3><div class="button-row">${flow.sources.map((ref) => refButton(ref)).join("")}</div></section><section class="section"><h3>Connected flow members</h3>${memberHtml(flow.members)}</section><section class="section"><h3>Sinks</h3><div class="button-row">${flow.sinks.map((ref) => refButton(ref)).join("")}</div></section><section class="section"><h3>Keyed semantics</h3>${semanticHtml(flow.semantics)}</section>`);
    }

    function showArchitecture() {
      const graph = DATA.graphs[currentGraphId]; const architecture = graph.architecture; if (!architecture) return;
      const refs = architecture.components.flatMap((item) => item.members).concat(architecture.connections.flatMap((item) => item.support));
      selected = {kind: "architecture", id: "architecture", refs}; highlightSelection();
      const components = architecture.components.map((item) => `<div class="semantic"><div><span class="badge">${esc(item.kind)}</span> <strong>${esc(item.name)}</strong> <code>${esc(item.id)}</code></div><p>${esc(item.overview)}</p><div class="button-row">${item.members.map((ref) => refButton(ref)).join("")}</div>${semanticHtml(item.semantics)}</div>`).join("");
      const connections = architecture.connections.map((item) => `<div class="semantic"><div><span class="badge">${esc(item.kind)}</span> <strong>${esc(item.source)} → ${esc(item.target)}</strong></div><p>${esc(item.label)}</p><div class="button-row">${item.support.map((ref) => refButton(ref)).join("")}</div>${semanticHtml(item.semantics)}</div>`).join("");
      setDetail(`<div class="kicker">Static architecture</div><h2>${esc(architecture.overview)}</h2><section class="section"><h3>Rationale</h3><p class="summary">${esc(architecture.rationale)}</p></section><section class="section"><h3>Components and boundaries</h3>${components}</section>${connections ? `<section class="section"><h3>Connections</h3>${connections}</section>` : ""}<section class="section"><h3>Keyed semantics</h3>${semanticHtml(architecture.semantics)}</section>`);
    }

    function nodeTypes(node) {
      return [...new Set([node.dataType, ...node.inputs.map((item) => item.type), ...node.outputs.map((item) => item.type)].filter(Boolean))];
    }

    function stateSetHtml(node) {
      if (node.kind !== "ACTION" && !node.stateSet?.length) return "";
      if (!node.stateSet?.length) return `<section class="section"><h3>Visible state set</h3><div class="empty">No visible state.</div></section>`;
      return `<section class="section"><h3>Visible state set</h3>${node.stateSet.map((item) => `<div class="semantic"><div><span class="badge">${esc(item.access)}</span> ${refButton({kind: "node", id: item.state}, item.state)}</div><p>${esc(item.meaning)}</p>${semanticHtml(item.semantics)}</div>`).join("")}</section>`;
    }

    function sameStateHtml(node) {
      if (node.kind !== "STATE") return "";
      const links = node.sameStateAs || [];
      if (!links.length) {
        return `<section class="section"><h3>State occurrence</h3><div class="empty">${node.sources?.length ? "First sourced occurrence of this state." : "No source or same-state link recorded."}</div></section>`;
      }
      return `<section class="section"><h3>Same-state links</h3>${links.map((item) => {
        const target = item.graph === currentGraphId
          ? refButton({kind: "node", id: item.state}, item.state)
          : `<button class="secondary-button" type="button" data-node-ref="${esc(item.state)}" data-graph-ref="${esc(item.graph)}">${esc(item.graph)} / ${esc(item.state)}</button>`;
        return `<div class="semantic"><div><span class="badge">${esc(item.relation)}</span> ${target}</div><p>${esc(item.meaning)}</p>${semanticHtml(item.semantics)}</div>`;
      }).join("")}</section>`;
    }

    function proseConditionsHtml(title, items) {
      if (!items || !items.length) return "";
      return `<section class="section"><h3>${esc(title)}</h3>${items.map((item) => `<div class="semantic"><div>${item.kind ? `<span class="badge">${esc(item.kind)}</span> ` : ""}<code>${esc(item.id)}</code></div><p>${esc(item.text)}</p></div>`).join("")}</section>`;
    }

    function showNode(nodeId) {
      const graph = DATA.graphs[currentGraphId];
      const node = graph.nodes.find((item) => item.id === nodeId);
      if (!node) return;
      selected = {kind: "node", id: node.id};
      highlightSelection();
      const types = nodeTypes(node);
      const expansion = node.expands && DATA.graphs[node.expands]
        ? `<section class="section"><button class="primary-button" type="button" data-expand-graph="${esc(node.expands)}">Open refinement: ${esc(node.expands)}</button></section>`
        : node.expands ? `<section class="section planned"><span class="badge">planned refinement</span><br><code>${esc(node.expands)}</code> is declared but not authored in this review set.</section>` : "";
      setDetail(`<div class="kicker">${esc(node.kind)}</div><h2>${esc(node.label)}</h2><div class="record-id"><code>${esc(node.id)}</code></div>${types.length ? `<section class="section"><h3>Concrete types</h3><div class="button-row">${types.map((item) => typeButton(item)).join("")}</div></section>` : ""}<section class="section"><h3>Typed API</h3>${portTable(node.inputs, node.outputs)}</section>${proseConditionsHtml("Preconditions", node.preconditions)}${proseConditionsHtml("Postconditions", node.postconditions)}${stateSetHtml(node)}${sameStateHtml(node)}${dataSourcesHtml(node)}<section class="section"><h3>Keyed semantics</h3>${semanticHtml(node.semantics)}</section>${expansion}${evidenceHtml(node.evidence, graph)}`);
    }

    function showEdge(edgeId) {
      const graph = DATA.graphs[currentGraphId];
      const edge = graph.edges.find((item) => item.id === edgeId);
      if (!edge) return;
      selected = {kind: "edge", id: edge.id};
      highlightSelection();
      setDetail(`<div class="kicker">Edge · ${esc(edge.family || "unclassified")} / ${esc(edge.kind)}</div><h2>${esc(edge.label || edge.id)}</h2><div class="record-id"><code>${esc(edge.id)}</code></div><section class="section"><h3>Connection</h3><div class="button-row"><button class="secondary-button" type="button" data-node-ref="${esc(edge.source)}" data-graph-ref="${esc(currentGraphId)}">${esc(edge.source)}</button><span>→</span><button class="secondary-button" type="button" data-node-ref="${esc(edge.target)}" data-graph-ref="${esc(currentGraphId)}">${esc(edge.target)}</button></div>${edge.condition ? `<p>Condition: <code>${esc(edge.condition)}</code></p>` : ""}</section>${proseConditionsHtml("Branch conditions", edge.conditions)}<section class="section"><h3>Keyed semantics</h3>${semanticHtml(edge.semantics)}</section>${evidenceHtml(edge.evidence, graph)}`);
    }

    function typeTable(type) {
      if (type.kind === "enum") return `<div class="table-scroll"><table><thead><tr><th>Value</th><th>Number</th><th>Meaning</th></tr></thead><tbody>${type.values.map((value) => `<tr><td><code>${esc(value.name)}</code></td><td>${esc(value.number)}</td><td>${esc(value.meaning)}${value.semantics.length ? `<div class="semantic-meta">${value.semantics.map((item) => `${esc(item.key)}: ${esc(item.value)}`).join(" · ")}</div>` : ""}</td></tr>`).join("")}</tbody></table></div>`;
      return `<div class="table-scroll"><table><thead><tr><th>Field</th><th>Type</th><th>Presence</th><th>Meaning</th></tr></thead><tbody>${type.fields.map((field) => `<tr><td><code>${esc(field.name)}</code>${field.oneof ? `<div class="semantic-meta">oneof ${esc(field.oneof)}</div>` : ""}</td><td>${typeButton(field.type)}</td><td>${esc(field.presence)}</td><td>${esc(field.meaning)}${field.semantics.length ? `<div class="semantic-meta">${field.semantics.map((item) => `${esc(item.key)}: ${esc(item.value)}`).join(" · ")}</div>` : ""}</td></tr>`).join("")}</tbody></table></div>`;
    }

    function operationsHtml(type) {
      if (!type.operations.length) return "";
      return `<section class="section"><h3>Contract-visible operations</h3>${type.operations.map((operation) => `<div class="semantic"><div><code>${esc(operation.name)}</code> <span class="badge">${esc(operation.kind)}</span></div><p>${esc(operation.overview)}</p>${portTable(operation.inputs, operation.outputs)}${semanticHtml(operation.semantics)}</div>`).join("")}</section>`;
    }

    function showType(typeRef) {
      const type = DATA.types[typeRef];
      if (!type) return;
      const refs = DATA.references[typeRef] || [];
      setDetail(`<div class="kicker">Type · ${esc(type.kind)}</div><h2>${esc(type.name)}</h2><div class="record-id"><code>${esc(type.id)}</code></div><p class="summary">${esc(type.represents)}</p><section class="section"><h3>Type semantics</h3>${semanticHtml(type.semantics)}</section><section class="section"><h3>${type.kind === "enum" ? "Values" : "Fields"}</h3>${typeTable(type)}</section>${operationsHtml(type)}${refs.length ? `<section class="section"><h3>Direct graph references</h3><div class="button-row">${refs.map((ref) => `<button class="secondary-button" type="button" data-node-ref="${esc(ref.node)}" data-graph-ref="${esc(ref.graph)}">L${DATA.registry[ref.graph].depth} ${esc(DATA.graphs[ref.graph].name)} / ${esc(ref.label)}</button>`).join("")}</div></section>` : ""}${selected.kind === "node" ? `<section class="section"><button class="secondary-button" type="button" data-return-node="${esc(selected.id)}">Return to selected node</button></section>` : ""}`);
    }

    function navigateToNode(graphId, nodeId) {
      if (graphId !== currentGraphId) { currentGraphId = graphId; renderGraph(nodeId); }
      else showNode(nodeId);
    }

    function selectGraph(graphId) { currentGraphId = graphId; renderGraph(); }

    function fallbackLayout(graph) {
      const columns = Math.max(3, Math.ceil(Math.sqrt(graph.nodes.length * 1.6)));
      const placements = {};
      graph.nodes.forEach((node, index) => { placements[node.id] = {x: 150 + (index % columns) * 270, y: 85 + Math.floor(index / columns) * 150, width: 220, height: 82}; });
      return {width: columns * 270 + 30, height: Math.ceil(graph.nodes.length / columns) * 150 + 30, node: (id) => placements[id], edge: (edge) => { const source = placements[edge.source], target = placements[edge.target]; return {points: [{x: source.x + 110, y: source.y}, {x: target.x - 110, y: target.y}]}; }};
    }

    function computeLayout(graph) {
      if (!window.dagre) return fallbackLayout(graph);
      const layout = new dagre.graphlib.Graph({multigraph: true}).setGraph({rankdir: "LR", ranksep: 80, nodesep: 34, edgesep: 16, marginx: 28, marginy: 28}).setDefaultEdgeLabel(() => ({}));
      graph.nodes.forEach((node) => layout.setNode(node.id, {width: 220, height: node.dataType || node.expands ? 82 : 70}));
      graph.edges.forEach((edge) => layout.setEdge(edge.source, edge.target, {id: edge.id}, edge.id));
      dagre.layout(layout);
      return {width: layout.graph().width, height: layout.graph().height, node: (id) => layout.node(id), edge: (edge) => layout.edge({v: edge.source, w: edge.target, name: edge.id})};
    }

    function path(points) {
      if (!points?.length) return "";
      if (points.length < 3) return points.map((point, index) => `${index ? "L" : "M"}${point.x},${point.y}`).join(" ");
      let value = `M${points[0].x},${points[0].y}`;
      for (let index = 1; index < points.length; index++) value += ` L${points[index].x},${points[index].y}`;
      return value;
    }

    function svgText(parent, className, x, y, value) {
      const element = document.createElementNS(NS, "text");
      element.setAttribute("class", className); element.setAttribute("x", x); element.setAttribute("y", y); element.textContent = value; parent.appendChild(element);
    }

    function renderGraph(initialNode) {
      const graph = DATA.graphs[currentGraphId];
      const parent = DATA.parents[currentGraphId];
      graphName.textContent = graph.name;
      graphMeta.textContent = `L${DATA.registry[graph.id].depth} · ${graph.nodes.length} nodes · ${graph.edges.length} edges · ${graph.digest.slice(0, 12)}…`;
      document.getElementById("svg-title").textContent = graph.name;
      parentButton.disabled = !parent;
      graphList.querySelectorAll(".graph-link").forEach((button) => button.classList.toggle("is-selected", button.dataset.graphId === graph.id));
      const layout = computeLayout(graph);
      layoutBounds = {width: Math.max(1, layout.width), height: Math.max(1, layout.height)};
      edgeLayer.replaceChildren(); nodeLayer.replaceChildren();
      graph.edges.forEach((edge) => {
        const placement = layout.edge(edge); if (!placement?.points?.length) return;
        const group = document.createElementNS(NS, "g"); group.setAttribute("class", "edge-group"); group.dataset.edgeId = edge.id; group.setAttribute("role", "button"); group.setAttribute("aria-label", `Inspect edge ${edge.label || edge.id}`);
        const classes = ["edge-visible"];
        if (edge.family === "control" || /control|condition|branch|exit|failure|cancel/i.test(`${edge.kind} ${edge.label}`)) classes.push("is-control");
        if (edge.isState) classes.push("is-state");
        const visible = document.createElementNS(NS, "path"); visible.setAttribute("class", classes.join(" ")); visible.setAttribute("d", path(placement.points));
        const hit = document.createElementNS(NS, "path"); hit.setAttribute("class", "edge-hit"); hit.setAttribute("d", path(placement.points)); hit.addEventListener("click", (event) => { event.stopPropagation(); showEdge(edge.id); }); group.append(visible, hit);
        if (edge.label) { const middle = placement.points[Math.floor(placement.points.length / 2)]; svgText(group, "edge-label", middle.x, middle.y - 7, edge.label.length > 38 ? `${edge.label.slice(0, 36)}…` : edge.label); }
        edgeLayer.appendChild(group);
      });
      graph.nodes.forEach((node) => {
        const placement = layout.node(node.id); if (!placement) return;
        const group = document.createElementNS(NS, "g"); group.setAttribute("class", "node"); group.dataset.nodeId = node.id; group.dataset.kind = node.kind; group.setAttribute("transform", `translate(${placement.x - placement.width / 2},${placement.y - placement.height / 2})`); group.setAttribute("role", "button"); group.setAttribute("aria-label", `Inspect ${node.kind} ${node.label}`);
        const rect = document.createElementNS(NS, "rect"); rect.setAttribute("class", "node-shape"); rect.setAttribute("width", placement.width); rect.setAttribute("height", placement.height); rect.setAttribute("rx", node.kind === "EFFECT" || node.kind === "EXIT" ? placement.height / 2 : node.kind === "DATA" ? 15 : 6); group.appendChild(rect);
        svgText(group, "node-kind", 12, 17, node.kind); if (node.expands) svgText(group, "node-expand", placement.width - 12, 17, DATA.graphs[node.expands] ? "↳ child" : "↳ planned");
        const words = node.label.split(/\s+/); const lines = []; let line = ""; words.forEach((word) => { if ((line + " " + word).trim().length > 31 && line) { lines.push(line); line = word; } else line = (line + " " + word).trim(); }); if (line) lines.push(line);
        lines.slice(0, 2).forEach((value, index) => svgText(group, "node-label", 12, 38 + index * 16, value)); if (node.dataType) svgText(group, "node-type", 12, placement.height - 9, shortType(node.dataType));
        group.addEventListener("click", (event) => { event.stopPropagation(); showNode(node.id); }); nodeLayer.appendChild(group);
      });
      selected = initialNode ? {kind: "node", id: initialNode} : {kind: "graph", id: graph.id};
      if (initialNode) showNode(initialNode); else graphDetail(graph);
      requestAnimationFrame(focusStartView);
    }

    function highlightSelection() {
      app.querySelectorAll(".node.is-selected, .edge-group.is-selected, .node.is-related, .edge-group.is-related").forEach((item) => item.classList.remove("is-selected", "is-related"));
      if (selected.kind === "node") nodeLayer.querySelector(`[data-node-id="${CSS.escape(selected.id)}"]`)?.classList.add("is-selected");
      if (selected.kind === "edge") edgeLayer.querySelector(`[data-edge-id="${CSS.escape(selected.id)}"]`)?.classList.add("is-selected");
      (selected.refs || []).forEach((ref) => {
        if (ref.kind === "node") nodeLayer.querySelector(`[data-node-id="${CSS.escape(ref.id)}"]`)?.classList.add("is-related");
        if (ref.kind === "edge") edgeLayer.querySelector(`[data-edge-id="${CSS.escape(ref.id)}"]`)?.classList.add("is-related");
      });
      updateFeedbackTarget();
    }

    function updateView() { viewport.setAttribute("transform", `translate(${view.x} ${view.y}) scale(${view.scale})`); zoomValue.textContent = `${Math.round(view.scale * 100)}%`; }
    function fitView() { const rect = svg.getBoundingClientRect(); const padding = 44; const scale = Math.min((rect.width - padding * 2) / layoutBounds.width, (rect.height - padding * 2) / layoutBounds.height, 1.15); view = {scale: Math.max(.08, scale), x: (rect.width - layoutBounds.width * scale) / 2, y: (rect.height - layoutBounds.height * scale) / 2}; updateView(); }
    function focusStartView() { const rect = svg.getBoundingClientRect(); const scale = Math.min(1, Math.max(.5, (rect.height - 88) / layoutBounds.height)); view = {scale, x: 36, y: (rect.height - layoutBounds.height * scale) / 2}; updateView(); }
    function zoomAt(factor, clientX, clientY) { const rect = svg.getBoundingClientRect(); const px = clientX - rect.left, py = clientY - rect.top; const next = Math.min(3, Math.max(.08, view.scale * factor)); const worldX = (px - view.x) / view.scale, worldY = (py - view.y) / view.scale; view = {scale: next, x: px - worldX * next, y: py - worldY * next}; updateView(); }
    svg.addEventListener("wheel", (event) => { event.preventDefault(); zoomAt(event.deltaY < 0 ? 1.12 : .89, event.clientX, event.clientY); }, {passive: false});
    svg.addEventListener("pointerdown", (event) => { if (event.button !== 0 || event.target.closest(".node, .edge-group")) return; drag = {x: event.clientX, y: event.clientY, vx: view.x, vy: view.y}; svg.setPointerCapture(event.pointerId); svg.classList.add("is-dragging"); });
    svg.addEventListener("pointermove", (event) => { if (!drag) return; view.x = drag.vx + event.clientX - drag.x; view.y = drag.vy + event.clientY - drag.y; updateView(); });
    svg.addEventListener("pointerup", (event) => { drag = null; svg.releasePointerCapture(event.pointerId); svg.classList.remove("is-dragging"); });
    svg.addEventListener("click", () => graphDetail(DATA.graphs[currentGraphId]));
    fitButton.addEventListener("click", fitView);
    zoomIn.addEventListener("click", () => { const rect = svg.getBoundingClientRect(); zoomAt(1.25, rect.left + rect.width / 2, rect.top + rect.height / 2); });
    zoomOut.addEventListener("click", () => { const rect = svg.getBoundingClientRect(); zoomAt(.8, rect.left + rect.width / 2, rect.top + rect.height / 2); });
    parentButton.addEventListener("click", () => { const parent = DATA.parents[currentGraphId]; if (parent) navigateToNode(parent.graph, parent.node); });

    const feedbackSelected = document.getElementById("feedback-selected");
    const feedbackInput = document.getElementById("feedback-input");
    const feedbackAdd = document.getElementById("feedback-add");
    const feedbackRefresh = document.getElementById("feedback-refresh");
    const feedbackList = document.getElementById("feedback-list");

    function selectedRef() {
      if (!selected || selected.kind === "graph") return {kind: "graph", id: currentGraphId};
      if (["node", "edge"].includes(selected.kind)) return {kind: selected.kind, id: selected.id};
      return {kind: selected.kind, id: selected.id, refs: selected.refs || []};
    }

    function updateFeedbackTarget() {
      const ref = selectedRef();
      const label = ref ? `${ref.kind}:${ref.id || currentGraphId}` : "none";
      feedbackSelected.innerHTML = `Selected: <code>${esc(label)}</code>`;
    }

    function renderFeedback(entries) {
      if (!entries.length) { feedbackList.innerHTML = `<div class="feedback-empty">No feedback yet.</div>`; return; }
      feedbackList.innerHTML = entries.map((entry) => {
        const resolved = entry.status === "resolved";
        return `<div class="feedback-item${resolved ? " is-resolved" : ""}">
          <div class="fb-head"><span class="fb-seq">#${esc(entry.seq)}</span><span class="fb-status ${esc(entry.status)}">${esc(entry.status)}</span><span>${esc(entry.ts || "")}</span>${entry.owner ? `<span class="fb-owner">${esc(entry.owner)}</span>` : ""}</div>
          <div class="fb-comment">${esc(entry.comment)}</div>
          <div class="fb-ref"><code>${esc(JSON.stringify(entry.ref))}</code><br><code>${esc(entry.blueprint_sha256 || "")}</code></div>
          ${resolved ? `<div class="fb-ref">${esc(entry.resolution_note || "")}</div>` : `<div class="fb-resolve"><button class="secondary-button" type="button" data-resolve-seq="${esc(entry.seq)}">Resolve</button></div>`}
        </div>`;
      }).join("");
      feedbackList.querySelectorAll("[data-resolve-seq]").forEach((button) => button.addEventListener("click", async () => {
        const seq = button.dataset.resolveSeq;
        try {
          const res = await fetch(`/api/feedback/${seq}/resolve`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({note: "resolved by agent", resolved_blueprint_sha256: DATA.blueprint.blueprintDigest})});
          const data = await res.json(); if (data.status !== "PASS") throw new Error(data.error || "resolve failed");
          await refreshFeedback();
        } catch (err) { feedbackList.innerHTML = `<div class="feedback-empty">Resolve failed (${esc(String(err))})</div>`; }
      }));
    }

    async function refreshFeedback() {
      try {
        const res = await fetch("/api/feedback?status=pending");
        const data = await res.json(); if (data.status !== "PASS") throw new Error(data.error || "request failed");
        renderFeedback(data.entries || []);
      } catch (err) {
        feedbackList.innerHTML = `<div class="feedback-empty">Feedback unavailable (${esc(String(err))})</div>`;
      }
    }

    feedbackAdd.addEventListener("click", async () => {
      const comment = feedbackInput.value.trim();
      const ref = selectedRef();
      if (!comment || !ref) return;
      try {
        const res = await fetch("/api/feedback", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({graph_id: currentGraphId, ref, comment, owner: (window.FEEDBACK_OWNER || "")})});
        const data = await res.json(); if (data.status !== "PASS") throw new Error(data.error || "add failed");
        feedbackInput.value = "";
        await refreshFeedback();
      } catch (err) { feedbackList.innerHTML = `<div class="feedback-empty">Add failed (${esc(String(err))})</div>`; }
    });
    feedbackRefresh.addEventListener("click", refreshFeedback);

    Object.keys(DATA.graphs).sort((a, b) => DATA.registry[a].depth - DATA.registry[b].depth || DATA.graphs[a].name.localeCompare(DATA.graphs[b].name)).forEach((graphId) => {
      const button = document.createElement("button"); button.type = "button"; button.className = "graph-link"; button.dataset.graphId = graphId; button.style.paddingLeft = `${8 + DATA.registry[graphId].depth * 14}px`; button.innerHTML = `<strong>L${DATA.registry[graphId].depth} · ${esc(DATA.graphs[graphId].name)}</strong><span>${esc(graphId)}</span>`; button.addEventListener("click", () => selectGraph(graphId)); graphList.appendChild(button);
    });
    identity.innerHTML = `<div><strong>${esc(DATA.blueprint.id)}</strong><br>version ${esc(DATA.blueprint.version)} · ${esc(DATA.blueprint.lifecycle)} · ${esc(DATA.blueprint.stage)}</div><div>Blueprint digest<code>${esc(DATA.blueprint.blueprintDigest)}</code></div><div>Semantic digest<code>${esc(DATA.blueprint.semanticDigest)}</code></div><div>Schema digest<code>${esc(DATA.blueprint.schemaDigest)}</code></div>${DATA.blueprint.warningCount ? `<div><span class="badge">${DATA.blueprint.warningCount} planned refinements</span></div>` : ""}`;
    renderGraph();
    refreshFeedback();
  })();
  </script>
</body>
</html>
